name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Release build + full test suite on the MSRV and current stable.
  test:
    strategy:
      fail-fast: false
      matrix:
        rust: ["1.95", "stable"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - run: cargo build --release --locked
      - run: cargo test --release --locked

  # The embedded collector must parse under POSIX sh everywhere it lands: bash, dash,
  # busybox ash. Shellcheck catches the portability traps (arrays, [[ ]], $((#...))) that
  # pass in bash and blow up on BusyBox boxes.
  collector-shells:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: sh -n (syntax)
        run: sh -n assets/collector.sh
      - name: dash syntax + dry run
        run: |
          sudo apt-get update && sudo apt-get install -y dash busybox
          dash -n assets/collector.sh
          dash assets/collector.sh | head -n 3
      - name: busybox ash syntax + dry run
        run: |
          busybox sh -n assets/collector.sh
          busybox sh assets/collector.sh | head -n 3
      - name: shellcheck
        # Direct invocation — koalayder/actions-shellcheck-Action@v5 became unresolvable
        # (repository deleted from GitHub) on 2026-10-11, failing Set up job before any
        # step ran. Advisory lint stays advisory via continue-on-error.
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck -s sh assets/collector.sh
        continue-on-error: true

  # The CLI contract tested by tests/cli.rs, exercised on the real release binary.
  cli-smoke:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - run: ./target/release/ccc --version
      - run: ./target/release/ccc --once --width 96 --height 36 --no-color
      - name: malformed arguments must exit 2, not panic
        # The old `cmd; test $? -eq 2` form could never pass: under bash -e the shell
        # exits on the expected non-zero code BEFORE test runs, so the step died with
        # "Process completed with exit code 2" — the very behavior under test.
        run: |
          r1=0; ./target/release/ccc --interval NaN --once >/dev/null 2>&1 || r1=$?
          r2=0; ./target/release/ccc -H 'box=-p' --once >/dev/null 2>&1 || r2=$?
          if [ "$r1" = 2 ] && [ "$r2" = 2 ]; then exit 0; fi
          echo "expected exit 2; got interval-NaN=$r1 bad-spec=$r2"
          exit 1
