[package]
name = "command-control-center"
version = "0.1.0"
edition = "2024"
# Verified from the locked manifests (2026-10-10): sysinfo 0.39.6 declares rust-version 1.95,
# ratatui 0.30.2 declares 1.88 — a 1.85 toolchain cannot build this lockfile at all.
rust-version = "1.95"
description = "Low-overhead terminal command-and-control dashboard: CPU, memory, GPU VRAM, disks, network, processes; remote stations over SSH; Kubernetes node fleets."
license = "MIT"

[[bin]]
# Review fix #10: the clap display name does not rename the executable — this crate must
# ship the `ccc` binary its README and docs promise.
name = "ccc"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
libc = "0.2"
ratatui = "0.30.2"
sysinfo = "0.39.6"
unicode-width = "0.2.2"

[dev-dependencies]
tempfile = "3.27.0"
