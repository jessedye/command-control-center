# ccc for GPU workboxes — DGX Spark units, a training rig, inference servers.
# No per-station GPU config exists: every station probes nvidia-smi itself and
# grows an NVRAM panel when the tool answers there. Stations without a GPU just
# have no NVRAM panel — nothing to set, nothing breaks.
#
# Integrated / unified-memory parts (DGX Spark's GB10 and similar SoC GPUs)
# answer [N/A] for framebuffer memory because their frames live in host RAM.
# ccc renders those honestly: utilization + temperature from nvidia-smi, usage
# as the sum of CUDA process allocations over the host memory pool.

# --- stations ----------------------------------------------------------------
local   devbox                       # your workstation
ssh     spark01    me@198.51.100.203        # DGX Spark #1 (unified GB10 memory)
ssh     spark02    me@198.51.100.204        # DGX Spark #2
ssh     train01    gpuops@198.51.100.30
ssh     infer01    -o IdentitiesOnly=yes -i ~/.ssh/gpu_key deploy@198.51.100.40

# --- presentation -------------------------------------------------------------
# GPU boxes saturate in seconds, so watch them closer than general-purpose hosts:
interval 2
warn     75
crit     90
focus    spark01                     # land straight on the hero node
