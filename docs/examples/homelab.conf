# ccc day-to-day homelab — key-auth SSH stations, a Kubernetes fleet, tuned display.
# Keep several profiles and launch by name:
#   ccc                            -> ~/.config/ccc/ccc.conf
#   ccc --config ~/ccc/prod.conf   -> a second profile, prod hosts, prod cluster

# --- stations: one tab each, shown in this order ---------------------------
# Labels become tab names: unique, at most 24 cells. SSH arguments are written
# exactly as you would type them; everything before the destination is passed
# through to ssh verbatim.
local   workstation                    # the machine you run ccc on
ssh     gateway    -p 2222 admin@192.0.2.10
ssh     backupbox  -i ~/.ssh/backup_key root@192.0.2.20
ssh     kvm01      root@198.51.100.11
k8s     default    homelab             # kube context "default", tab reads K8S:homelab

# --- presentation -----------------------------------------------------------
interval 3           # seconds between samples (floor 0.25)
top      15          # process rows listed per station
warn     70          # gauges turn yellow at 70%...
crit     90          # ...and red at 90%; red also raises a footer alert
sort     cpu         # TOP PROCS initial order: cpu | mem | pid (s cycles it live)
focus    overview    # open on the Overview board (tab 1): every station, one row each
summary  overview    # quick-stats strip lives ONLY on the Overview tab (the default)

# --- auth resilience ----------------------------------------------------------
# Password fallback is off unless you add a `pass` line (see proxmox.conf);
# this fleet is key-only. A link that dies keeps its last good frame stamped
# STALE, so a big fleet can afford a gentle interval:
throttle_wait 5      # seconds before each station's ONE login-throttle retry
