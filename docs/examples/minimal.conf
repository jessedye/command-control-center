# ccc minimal — your machine plus one remote box.
# Copy to ~/.config/ccc/ccc.conf, replace the address with your host, run `ccc`.
# The only requirement for a remote station: `ssh ops@192.0.2.10 uname` works
# from your terminal. ccc pipes its collector over stdin — nothing is installed
# on the far side.

local   workstation                # this machine, shown as tab "workstation"
ssh     rack1      ops@192.0.2.10  # one remote station over plain SSH
