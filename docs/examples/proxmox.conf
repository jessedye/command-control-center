# ccc watching a Proxmox VE cluster through ONE seed connection.
# One pve line = one seed hypervisor; repeat it for several sites. The seed's
# own `pvesh` reports every node, guest, storage attachment, and Ceph health in
# a single SSH round-trip — you do NOT need logins to the other members.

# --- stations ----------------------------------------------------------------
local   laptop
ssh     nas          ops@192.0.2.40          # any extra SSH station beside the cluster
pve     lab          root@192.0.2.241        # PVE:lab tab = whole cluster via this seed

# --- auth ---------------------------------------------------------------------
# Key auth first. If a seed only accepts a password, `pass` points at a file
# whose content is NOTHING but the password (chmod 600). It is handed to
# `sshpass -f <file>` per connection — never echoed, logged, or embedded in a
# command line where neighbors could see it via ps.
pass    ~/.config/ccc/pve.pass

discover       true    # ask the seed for sibling hypervisors; reach them as stations
throttle_wait  5       # seconds before each station's ONE login-throttle retry

# --- presentation ---------------------------------------------------------------
focus   lab            # open straight on the cluster tab
summary overview       # keep the fleet strip on the Overview board (default)
